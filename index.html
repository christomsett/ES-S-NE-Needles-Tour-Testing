<!DOCTYPE html>
<html>

<head>
  <title>IoW Needles 360 Tour</title>

  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link rel="stylesheet" href="vendor/reset.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body class="multiple-scenes">

<!-- ===================================================== -->
<!-- SPLASH SCREEN (shown once on startup) -->
<!-- ===================================================== -->

<div id="splashScreen">
  <div id="splashCard">

    <button id="splashClose" type="button" aria-label="Close">✕</button>

    <div id="splashScroll">

      <section id="splashWelcome">
        <h1 id="splashHeading"></h1>
        <div id="splashBody"></div>
      </section>

      <section id="splashNavigation">
        <img id="splashNavigationImage" src="" alt="">
      </section>

      <section id="splashCredits">
        <h2 id="splashCreditsHeading"></h2>
        <div id="splashCreditsBody"></div>
        <img id="splashCreditsImage" src="" alt="">
      </section>

    </div>

    <button id="splashStart" type="button"></button>

  </div>
</div>

<div id="tourLayout">

  <!-- ========================= -->
  <!-- PANORAMA -->
  <!-- ========================= -->

  <div id="viewerContainer">

    <div id="pano"></div>

    <!-- ===================================================== -->
    <!-- SCENE LIST -->
    <!-- ===================================================== -->

    <a href="javascript:void(0)" id="sceneListToggle">
      <img class="icon off" src="img/expand.png">
      <img class="icon on" src="img/collapse.png">
    </a>

    <!--
      The <ul> below is intentionally empty in the HTML - index.js builds
      the whole scene list from data.js at runtime (using each scene's
      "id", "name", "listNumber" and "listLabel"). This is what keeps the
      list, the title bar, and data.js from ever drifting out of sync
      with each other again: edit a scene's name in ONE place (data.js)
      and every place it's displayed updates with it.
    -->
    <div id="sceneList">
      <ul class="scenes"></ul>
    </div>

    <!-- ===================================================== -->
    <!-- ICON KEY -->
    <!-- ===================================================== -->

    <a href="javascript:void(0)" id="iconKeyToggle" aria-label="Icon key">
      <img class="icon off" src="img/info.png">
      <img class="icon on" src="img/collapse.png">
    </a>

    <!--
      Also built at runtime, from data.settings.popupCategories in
      data.js - add a category there and it appears here automatically.
    -->
    <div id="iconKeyPanel">
      <div id="iconKeyTitle">Icon Key</div>
      <ul id="iconKeyList"></ul>
    </div>

    <!-- ===================================================== -->
    <!-- TITLE BAR -->
    <!-- ===================================================== -->

    <div id="titleBar">
      <h1 class="sceneName"></h1>
    </div>

    <!-- ===================================================== -->
    <!-- CONTROLS -->
    <!-- ===================================================== -->

    <a href="javascript:void(0)" id="autorotateToggle">
      <img class="icon off" src="img/play.png">
      <img class="icon on" src="img/pause.png">
    </a>

    <a href="javascript:void(0)" id="fullscreenToggle">
      <img class="icon off" src="img/fullscreen.png">
      <img class="icon on" src="img/windowed.png">
    </a>

    <!-- ===================================================== -->
    <!-- VIEW CONTROLS -->
    <!-- ===================================================== -->

    <a id="viewUp" class="viewControlButton viewControlButton-1">
      <img src="img/up.png">
    </a>

    <a id="viewDown" class="viewControlButton viewControlButton-2">
      <img src="img/down.png">
    </a>

    <a id="viewLeft" class="viewControlButton viewControlButton-3">
      <img src="img/left.png">
    </a>

    <a id="viewRight" class="viewControlButton viewControlButton-4">
      <img src="img/right.png">
    </a>

    <a id="viewIn" class="viewControlButton viewControlButton-5">
      <img src="img/plus.png">
    </a>

    <a id="viewOut" class="viewControlButton viewControlButton-6">
      <img src="img/minus.png">
    </a>

    <!-- Opens/closes the narrative panel -->
    <button id="infoToggle">
      ☰ Information
    </button>

  </div>


  <!-- ========================= -->
  <!-- INFORMATION PANEL (permanent sidecar) -->
  <!-- ========================= -->

  <aside id="infoPanel">

    <div id="infoHeader">

      <button id="infoClose">
        ✕
      </button>

      <img
        src="img/Logos.png"
        alt="University of Southampton"
        id="panelLogo">

      <h1 id="panelTitle">IoW Needles 360 Tour</h1>

    </div>

    <div id="infoContent">
      Loading...
    </div>

    <div id="infoNavigation" aria-label="Narrative scene navigation">
      <button id="infoPrevious" class="info-nav-button" type="button" aria-label="Previous scene">
        <span class="info-nav-arrow">←</span>
        <span class="info-nav-text">
          <span class="info-nav-label">Previous</span>
          <span class="info-nav-subtitle"></span>
        </span>
      </button>

      <button id="infoNext" class="info-nav-button" type="button" aria-label="Next scene">
        <span class="info-nav-text">
          <span class="info-nav-label">Next</span>
          <span class="info-nav-subtitle"></span>
        </span>
        <span class="info-nav-arrow">→</span>
      </button>
    </div>

  </aside>

</div>



<!-- ===================================================== -->
<!-- PIX4D MODEL -->
<!-- ===================================================== -->

<div class="embed-box" id="embedBox">

  <div class="embed-box-header">
    <span class="embed-box-title">3D Reconstructed Model</span>
    <button type="button" id="embedToggle" aria-label="Collapse 3D model">
      <img class="icon off" src="img/collapse.png" alt="">
      <img class="icon on" src="img/expand.png" alt="">
    </button>
  </div>

  <div class="embed-box-body">
    <iframe
      src="https://christomsett.github.io/EnvSens-Needles-Cesium/"
      frameborder="0"
      allowfullscreen>

    </iframe>
  </div>

</div>



<!-- ===================================================== -->
<!-- JAVASCRIPT -->
<!-- ===================================================== -->

<script src="vendor/screenfull.min.js"></script>
<script src="vendor/bowser.min.js"></script>
<script src="vendor/marzipano.js"></script>

<script src="data.js"></script>
<script src="index.js"></script>

</body>
</html>
